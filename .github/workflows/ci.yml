name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bunx prettier --check "src/**/*.{ts,tsx,css}" ".github/**/*.yml" "*.{ts,mjs,json,md,yml}"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: |
          if node -e "const { scripts } = require('./package.json'); process.exit(scripts?.test ? 0 : 1)"; then
            bun run test
          else
            echo "No test script found; skipping."
          fi

      - name: Build
        run: bun run build
